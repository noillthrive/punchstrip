# ---- 구간별 ----
# 전자 기타·가야금: o4d+(63) 이하 +2옥타브(default, 맑은 음), o4e(64) 이상 -2옥타브(alt, 튜닝음 세트, 음색 다름)
20=regions:..63:+24:default;64..:-24:alt
28=regions:..63:+24:default;64..:-24:alt
# 베이스: o3g(55) 이하 +1옥타브(default), 56~61(G#3~C#4) 무음, o4d(62) 이상 -3옥타브(alt)
29=regions:..55:+12:default;56..61:silent;62..:-36:alt

