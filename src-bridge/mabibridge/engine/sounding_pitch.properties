# ---- 소리 나는 적은 음 창 ----
# audible.<악기 번호>=<lo>..<hi> : 적은 음(MIDI) lo~hi(포함) 밖은 렌더에서 무음. 위 규칙의 무음 구간(베이스 56~61)에 더해진다.
# 출처: render_wav 렌더(2026-11-15), 적은 음 11~119를 하나씩(v12, 48틱, 3초 간격) 쳐서 음마다 RMS < -70 dBFS면 무음.
#   소리 나는 음은 모두 -45 dBFS보다 컸고 무음은 디지털 0이었다(경계가 뚜렷함). 노래·코러스·베이스만 적었다
#   (플룻 5는 DLS 음역 60~95 밖 27~100도 울려서, 일반 악기는 음역 표만으로 무음이라 하지 않는다).
#   시험 test-bridge/mabibridge/render/SilentRangeRenderTest가 같은 렌더로 이 줄들을 다시 확인한다(DLS 없으면 SKIP).
