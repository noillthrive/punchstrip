# 마비노기 악기별 "적은 음 대 들리는 음" 표 (MabiIcco MCP 브리지 )
#
# 출처(2026-11-01 측정, 두 조사가 같은 결론):
#   악기마다 render_wav로 렌더한 WAV의 기본 주파수 측정
#   MSXspirit01~05.dls 샘플 분석(샘플 이름·원음 높이·음역)
#
# 숫자는 모두 MIDI 번호다(MML o4c = MIDI 60 = C4. MabiIcco 내부 음 번호 = MIDI - 12).
# "적은 음" = 악보에 적은 MIDI 번호(브리지의 pitch), "들리는 음" = 실제로 울리는 음높이.
#
# 형식: <악기 번호>=<종류>[:<내용>]
#   offset:<반음>                       들리는 음 = 적은 음 + 반음
#   regions:<구간>;<구간>...             구간 = <from>..<to>:<반음>:<세트이름> 또는 <from>..<to>:silent
#                                        from·to는 포함, 비우면 열린 끝(..63 = 63 이하, 64.. = 64 이상)
#   fixed:<MIDI>                        적은 음과 무관하게 이 음 하나
#   unpitched                           음높이 없음(드럼·북·심벌즈: 음 번호가 소리 종류를 고른다)
#   sfx                                 효과음(새소리: 적은 음에 따라 소리는 바뀌지만 음높이 비교는 무의미)
# 표에 없는 번호(모바일 x.2 등)는 코드가 unknown(오프셋 0으로 가정, verified=false)으로 다룬다.
#
# 갱신 방법: 이 파일을 고친 뒤 ant bridge-jar(빌드가 src-bridge의 .properties를 jar에 복사한다).
# 고칠 때 출처 문서와 측정 날짜를 위 머리말에 함께 적는다. SoundingPitchTest가 주요 값을 확인한다.

