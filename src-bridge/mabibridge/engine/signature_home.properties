# score_finalize signature home pitches (MabiIcco MCP bridge)
#
# <program>=<sounding MIDI pitch>   (60 = C4, fractions allowed)
# The passage B D G E is placed in the octave whose four notes are all producible (never a silent written pitch;
# E a major sixth above G when producible, else a minor third below) and whose four-note mean is closest to this
# pitch (ties: the higher octave). The choice depends on the instrument only, so the passage sounds the same in
# every score. A program without an entry uses the middle of its producible sounding range.
#
# Seed (2026-11-15): the hand-built reference passage of six common instruments; each value is the mean of the
# reference passage, so these instruments reproduce it exactly.
#   flute 5      B5 D6 G6 E6   (83 86 91 88)
#   piano 21     B4 D5 G5 E6   (71 74 79 88)
#   lute 0       B3 D4 G4 E5   (59 62 67 76)
#   bass 29      B1 D2 G2 E3   (35 38 43 52)
#   mic 121      B4 D5 G5 E5   (71 74 79 76)
#   mic 120      same home as 121; 120 sounds only up to C#5 (written 29..61, +1 octave), so D5 is out of reach and
#                the closest producible passage is B3 D4 G4 E4 (lower E).
# Drums 27 do not use the home pitches (snare / crash keys).
#
# velocity_offset.<program>=<n>   (optional)
# Added to the signature velocity of that program after the velocity-scale conversion (x11 instruments), clamped to
# 1..15; for drums 27 it applies to the snares, the crash stays 15.
# Shipped: microphones 121 and 120 three steps lower (default v12 -> v9), because the voice sample is much louder
# than the instruments at the same velocity; drums 27 +3, so the three snare hits are written at v15 like the crash
# (default v12 -> v15; higher velocities are clamped to 15).
5=87
21=78
0=66
29=42
121=75
120=75
velocity_offset.121=-3
velocity_offset.120=-3
velocity_offset.27=3
